name: list-matched-workflows-action
description: List matched workflows against the changed files of the pull request.

inputs:
  workflows:
    description: Glob pattern to match workflow files
    required: true
  evaluate-pull-request-base-ref:
    description: If set, evaluate the branch name instead of the base branch of the current pull request
    required: true
    default: ${{ github.event.pull_request.base.ref }}
  evaluate-push-ref:
    description: If set, evaluate the ref instead of the current pushed ref
    required: true
    default: ${{ github.event.ref }}
  token:
    description: GitHub token
    required: true
    default: ${{ github.token }}

outputs:
  matched-workflows-json:
    description: JSON string of matched workflows

runs:
  using: 'node24'
  main: 'dist/index.js'
